name: Android test APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'App.tsx'
      - 'src/**'
      - 'assets/**'
      - 'scripts/collect-apk.mjs'
      - 'app.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: '1'
      NODE_ENV: production
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false

      - name: Check types and unit tests
        run: |
          pnpm typecheck
          pnpm test

      - name: Generate the Android project
        run: pnpm prebuild:android

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            pnpm-lock.yaml
            app.json
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Install Android build tools
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'

      - name: Build standalone APK for Android tablets
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Verify package and signing
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK"
          unzip -l "$APK" | grep 'assets/index.android.bundle'
          node scripts/collect-apk.mjs

      - name: Upload installable APK
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SketchBrowser-android-test
          path: dist/apk/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Add download instructions
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          printf '## SketchBrowser Android test APK\n\n[Download APK archive](%s)\n\nUnzip the archive and install the .apk on an ARM64 or ARMv7 Android tablet. Expo Go and a development server are not required. This build uses the Expo template test signing key.\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
