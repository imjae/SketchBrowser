plugins {
  id 'com.android.library' version '8.12.0'
  id 'org.jetbrains.kotlin.android' version '2.1.20'
}

android {
  namespace 'com.sketchbrowser.inputtests'
  compileSdk 36
  buildToolsVersion '36.0.0'
  defaultConfig { minSdk 24 }
  // Compile the production bridge itself; tests feed it raw Android events.
  sourceSets.main.java.srcDirs = [providers.gradleProperty('stylusSourceDir').getOrElse('../../plugins/android')]
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions { jvmTarget = '17' }
  testOptions {
    unitTests.includeAndroidResources = true
    unitTests.all {
      jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED',
        '--add-opens=java.base/java.util=ALL-UNNAMED',
        '--add-opens=java.base/java.io=ALL-UNNAMED',
        '--add-opens=java.base/java.net=ALL-UNNAMED',
        '--add-opens=java.base/java.security=ALL-UNNAMED',
        '--add-opens=java.base/java.text=ALL-UNNAMED',
        '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED',
        '--add-opens=java.desktop/java.awt.font=ALL-UNNAMED',
        '--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED'
      testLogging { events 'passed', 'failed'; exceptionFormat 'full' }
    }
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.16.1'
}
